version: '3.8'

services:
  aegisstrike:
    build:
      context: .
      dockerfile: docker/kali/Dockerfile
    container_name: aegisstrike
    volumes:
      - ./reports:/opt/aegisstrike/reports
      - ./logs:/opt/aegisstrike/logs
      - ./databases:/opt/aegisstrike/databases
    environment:
      - AEGIS_THREADS=10
      - AEGIS_TIMEOUT=30
    stdin_open: true
    tty: true
    network_mode: host
